<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ====== PRIMARY SEO META TAGS ====== -->
    <title>Material Wear Limited — Premium Clothing Brand</title>
    <meta name="description" content="Material Wear Limited offers premium quality clothing crafted with passion. Explore our curated collections of timeless, sustainable fashion for the modern individual." />
    <meta name="keywords" content="material wear, clothing brand, premium fashion, sustainable clothing, Nigerian fashion, quality apparel, men's wear, women's wear" />
    <meta name="author" content="Material Wear Limited" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#064E3B" />

    <!-- ====== OPEN GRAPH / FACEBOOK ====== -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.materialwearlimited.com/" />
    <meta property="og:title" content="Material Wear Limited — Premium Clothing Brand" />
    <meta property="og:description" content="Discover premium quality clothing crafted with passion. Timeless, sustainable fashion for the modern individual." />
    <!-- Must be a static, absolute URL — crawlers (WhatsApp, Facebook, Twitter)
         don't run JS, so this can't be injected from assets.js at runtime.
         Keep in sync with ASSETS.social.og in src/config/assets.js. -->
    <meta property="og:image" content="https://res.cloudinary.com/dhhaiy58r/image/upload/c_fill,w_1200,h_630/v1729164616/mj_11226_4_no8nuz.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Material Wear Limited" />
    <meta property="og:locale" content="en_NG" />

    <!-- ====== TWITTER CARD ====== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.materialwearlimited.com/" />
    <meta name="twitter:title" content="Material Wear Limited — Premium Clothing Brand" />
    <meta name="twitter:description" content="Discover premium quality clothing crafted with passion." />
    <meta name="twitter:image" content="https://res.cloudinary.com/dhhaiy58r/image/upload/c_fill,w_1200,h_630/v1729164616/mj_11226_4_no8nuz.jpg" />
    <meta name="twitter:site" content="@materialwearlimited" />

    <!-- ====== CANONICAL URL ====== -->
    <link rel="canonical" href="https://www.materialwearlimited.com/" />

    <!-- ====== FAVICON ====== -->
    <!-- Real brand logo, square-cropped by Cloudinary. Keep in sync with
         ASSETS.logo.icon in src/config/assets.js. -->
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dhhaiy58r/image/upload/c_fill,w_180,h_180/v1786786523/hood_pics/material_logo_dl7qrk.png" />
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dhhaiy58r/image/upload/c_fill,w_180,h_180/v1786786523/hood_pics/material_logo_dl7qrk.png" />

    <!-- ====== GOOGLE FONTS ====== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Jost:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ====== GOOGLE ADSENSE ====== -->
    <!-- Loaded from src/utils/adsense.js using VITE_ADSENSE_ID, so it only
         runs once a real publisher ID is configured. Set the ID in .env
         rather than hardcoding a script tag here. -->

    <!-- ====== STRUCTURED DATA (JSON-LD) for Google ====== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "Material Wear Limited",
      "description": "Premium quality clothing brand crafted with passion and sustainability in mind.",
      "identifier": "RC 9161164",
      "url": "https://www.materialwearlimited.com",
      "logo": "https://res.cloudinary.com/dhhaiy58r/image/upload/v1786786523/hood_pics/material_logo_dl7qrk.png",
      "image": "https://res.cloudinary.com/dhhaiy58r/image/upload/c_fill,w_1200,h_630/v1729164616/mj_11226_4_no8nuz.jpg",
      "priceRange": "$$",
      "telephone": "+2348071000804",
      "email": "hello@materialwearlimited.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "16 Emejiaka Street, Ngwa Rd",
        "addressLocality": "Aba",
        "addressRegion": "Abia State",
        "addressCountry": "NG"
      },
      "sameAs": [
        "https://www.instagram.com/materialwearlimited",
        "https://www.facebook.com/materialwearlimited",
        "https://x.com/materialwearlimited",
        "https://www.youtube.com/channel/UCQnF948bKmhs2_quXEJY0og"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
