server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback: any path that isn't a real file falls through to
    # index.html, letting React Router handle it client-side. Without this,
    # a direct visit or refresh on e.g. /collections would 404 instead of
    # rendering the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (immutable filenames) — safe to cache long-term.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
